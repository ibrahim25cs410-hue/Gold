<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Gold AI</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var s=localStorage.getItem("ag-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=s;var l=localStorage.getItem("ag-lang")||"ar";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr"}catch(e){}</script>
<style>
:root{--bg:#09090b;--card:#ffffff0b;--card2:#ffffff12;--line:#ffffff17;--text:#f5f5f7;--mut:#9a9aa6;--gold:#e8b84f;--g1:#fff1c6;--g2:#e8b84f;--up:#32d583;--down:#ff5c6c;--glow:#e8b84f26;--on:#1b1405;--shadow:0 20px 60px #0006}
html[data-theme=light]{--bg:#f3f2ee;--card:#ffffffd9;--card2:#00000008;--line:#00000014;--text:#17171b;--mut:#6c6c78;--gold:#b7821a;--g1:#8a5c08;--g2:#c9921f;--up:#0f9d63;--down:#d93a4a;--glow:#e8b84f33;--on:#fff;--shadow:0 16px 40px #0000001a}
*{box-sizing:border-box;margin:0}
html[lang=ar]{font-family:"IBM Plex Sans Arabic",Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.75}
html[lang=en]{font-family:Inter,"Segoe UI",system-ui,sans-serif;line-height:1.55;letter-spacing:-.01em}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 90% -5%,var(--glow),transparent 70%),radial-gradient(600px 400px at 0% 0%,#4a78b422,transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{display:inline-block;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;letter-spacing:0}
.wrap{position:relative;width:min(1200px,calc(100% - 32px));margin:auto}
/* nav */
nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(22px) saturate(1.4);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px}
.brand img{width:36px;height:36px;border-radius:11px;object-fit:cover}
.tools{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--text)}
.chip.icon{width:38px;padding:0;justify-content:center}
.chip:hover{background:var(--card2)}
.dot{width:8px;height:8px;border-radius:50%;background:#8a8a95;flex:none}
.dot.ok{background:var(--up);box-shadow:0 0 10px var(--up)}.dot.err{background:var(--down)}.dot.busy{background:var(--gold);animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* title */
.top{padding:38px 0 26px}
.top h1{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1.2;max-width:760px}
html[lang=en] .top h1{letter-spacing:-.035em}
.top p{color:var(--mut);margin-top:10px;max-width:640px;font-size:15px}
/* bento */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding-bottom:40px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.card h2{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:16px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;background:linear-gradient(145deg,var(--card2),var(--card));overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;inset-inline-start:-90px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.lbl{font-size:14px;color:var(--mut);font-weight:500}
.price{font-size:clamp(46px,8.5vw,84px);font-weight:800;line-height:1.1;margin:6px 0 10px;background:linear-gradient(180deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .price{letter-spacing:-.04em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.badge.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.badge.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.sub{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:17px;font-weight:700}
.panel{display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:500}
.seg{--n:3;--i:0;--dir:1;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
[dir=rtl] .seg{--dir:-1}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc((100% - 8px)/var(--n));border-radius:10px;background:linear-gradient(135deg,var(--g2),var(--g1));transform:translateX(calc(var(--i)*100%*var(--dir)));transition:transform .28s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;border:0;background:none;height:38px;font-size:13px;font-weight:600;color:var(--mut);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--on)}
.run{height:54px;border:0;border-radius:16px;font-weight:700;font-size:16px;color:var(--on);background:linear-gradient(135deg,var(--g2),var(--g1));box-shadow:0 10px 30px var(--glow);transition:transform .15s}
html[data-theme=light] .run{color:#fff;background:linear-gradient(135deg,#c9921f,#a56e0d)}
.run:hover{transform:translateY(-1px)}.run:active{transform:scale(.98)}.run:disabled{opacity:.6;cursor:wait}
.acts{display:flex;gap:10px}.acts .chip{flex:1;justify-content:center;height:42px;border-radius:14px}
.stale{margin-top:16px;padding:10px 14px;border-radius:14px;font-size:13px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.stale[hidden]{display:none}
.err{display:none;padding:12px 14px;border-radius:14px;font-size:13px;background:color-mix(in srgb,var(--down) 12%,transparent);border:1px solid color-mix(in srgb,var(--down) 40%,transparent);color:var(--down)}
.err.show{display:block}
/* chart */
.chartbox{position:relative;height:300px;direction:ltr}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--mut);direction:inherit;gap:2px}
.empty b{color:var(--text);font-size:16px}
.lg{display:flex;gap:18px;font-size:12px;color:var(--mut);margin-top:12px}
.lg i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--gold);margin-inline-end:7px;vertical-align:middle}
.lg i.f{background:repeating-linear-gradient(90deg,var(--up) 0 5px,transparent 5px 9px)}
/* insight */
.ring{position:relative;width:150px;height:150px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:28px;font-weight:800;line-height:1.1}
.ring small{font-size:11px;color:var(--mut);font-weight:500}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.kv span{color:var(--mut)}.kv b{font-weight:600}
/* units */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:start;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card2);transition:.2s}
.tile.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tile span{display:block;font-weight:600;font-size:14px}.tile small{display:block;color:var(--mut);font-size:11px;margin-bottom:8px}
.tile b{font-size:17px;font-weight:700}
.iqd{margin-top:14px;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card2);font-size:13px;color:var(--mut)}
.iqd b{font-size:16px;color:var(--text)}
/* converter */
.cv{display:grid;gap:12px}
.cv input{width:100%;height:50px;padding:0 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cv input:focus{outline:0;border-color:var(--gold)}
.note{font-size:12px;color:var(--mut);margin-top:12px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 32px;border-top:1px solid var(--line)}
.skel{animation:p 1s infinite}
@media(max-width:900px){.c8,.c7,.c5,.c4{grid-column:span 12}.hero{grid-template-columns:1fr;gap:24px}}
@media(max-width:520px){.card{padding:20px;border-radius:24px}.stats{grid-template-columns:1fr 1fr}.chip .tx{display:none}.chip.pill{padding:0 12px}.top{padding-top:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><div class="wrap nav">
  <div class="brand"><img src="icon.png" alt="" onerror="this.style.display='none'"><span>Aura Gold AI</span></div>
  <div class="tools">
    <div class="chip pill" role="status"><i class="dot" id="dot"></i><span class="tx" id="st"></span></div>
    <button class="chip icon" id="theme" aria-label="Theme"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="chip" id="lang"></button>
  </div>
</div></nav>

<div class="wrap">
<header class="top"><h1 data-i="title"></h1><p data-i="desc"></p></header>

<main class="grid">
  <section class="card hero c12" aria-live="polite">
    <div>
      <div class="lbl" data-i="plabel"></div>
      <div class="price"><span class="num" id="price">—</span></div>
      <div class="meta"><span class="badge" id="dir">—</span><span class="badge" id="chgb" hidden><span class="num" id="chg"></span></span><span class="sub" id="hz"></span></div>
      <div class="stale" id="stale" hidden></div>
      <div class="stats">
        <div class="stat"><span data-i="cur"></span><b class="num" id="cur">—</b></div>
        <div class="stat"><span data-i="diff"></span><b class="num" id="diff">—</b></div>
        <div class="stat"><span data-i="unitl"></span><b id="unitn">—</b></div>
      </div>
    </div>
    <div class="panel">
      <div class="field"><label data-i="hor"></label><div class="seg" id="hseg"><button data-v="1"></button><button data-v="7"></button><button data-v="30"></button></div></div>
      <div class="field"><label data-i="unit"></label><div class="seg" id="useg" style="--n:4"><button data-v="ounce"></button><button data-v="g24"></button><button data-v="g21"></button><button data-v="g18"></button></div></div>
      <button class="run" id="run" data-i="run"></button>
      <div class="acts">
        <button class="chip" id="refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg><span data-i="refresh"></span></button>
        <button class="chip" id="clear"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span data-i="clear"></span></button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </div>
  </section>

  <section class="card c8">
    <h2 data-i="chart"></h2>
    <div class="chartbox"><canvas id="cv"></canvas><div class="empty" id="empty"><b data-i="e1"></b><span data-i="e2"></span></div></div>
    <div class="lg"><span><i></i><span data-i="lh"></span></span><span><i class="f"></i><span data-i="lf"></span></span></div>
  </section>

  <section class="card c4">
    <h2 data-i="acc"></h2>
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="75" cy="75" r="64" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402" style="transition:stroke-dashoffset 1.2s cubic-bezier(.3,.9,.3,1)"/></svg>
      <div class="v"><span><span class="num" id="accv">—</span><br><small data-i="test"></small></span></div>
    </div>
    <div class="kv"><span data-i="model"></span><b>LightGBM</b></div>
    <div class="kv"><span data-i="sig"></span><b id="sig">—</b></div>
    <div class="kv"><span data-i="edge"></span><b id="edge">—</b></div>
    <p class="note" data-i="warn"></p>
  </section>

  <section class="card c7">
    <h2 data-i="all"></h2>
    <div class="tiles" id="tiles"></div>
    <div class="iqd"><span data-i="iqdv"></span><b class="num" id="iqdv">—</b></div>
  </section>

  <section class="card c5">
    <h2 data-i="conv"></h2>
    <div class="cv">
      <div class="field"><label data-i="usd"></label><input id="usd" type="number" min="0" step="any" placeholder="0.00" inputmode="decimal"></div>
      <div class="field"><label data-i="iqd"></label><input id="iqd" type="number" min="0" step="any" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label data-i="rate"></label><input id="rate" type="number" min="1" value="1550"></div>
    </div>
    <p class="note" data-i="rn"></p>
  </section>
</main>
<footer>Future AI Team • University of Mosul © 2026</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),OZ=31.1035;
const DIV={ounce:1,g24:OZ,g21:OZ*24/21,g18:OZ*24/18};
const T={
ar:{title:"توقّعات الذهب بذكاء البيانات",desc:"نموذج تعلّم آلي مدرَّب على الأسعار التاريخية. النتائج تقديرية وليست نصيحة استثمارية.",plabel:"السعر المتوقع للإغلاق",cur:"السعر الحالي",diff:"الفرق المتوقع",unitl:"الوحدة",hor:"مدة التوقع",unit:"الوحدة والعيار",run:"شغّل التوقع",refresh:"تحديث",clear:"مسح",chart:"مسار السعر والتوقع",e1:"لا توجد نتائج بعد",e2:"اضغط «شغّل التوقع» لعرض المسار.",lh:"السعر الحالي والتاريخ",lf:"التوقع",acc:"أداء النموذج",test:"دقة الاتجاه",model:"النموذج",sig:"الإشارة",warn:"الدقة محسوبة على آخر 15% من البيانات التي لم يرَها النموذج أثناء التدريب، وتُقارَن بخط الأساس. لا تضمن نتائج المستقبل.",all:"السعر المتوقع بكل الوحدات",iqdv:"القيمة بالدينار العراقي",conv:"حاسبة الدولار والدينار",usd:"المبلغ بالدولار",iqd:"المبلغ بالدينار العراقي",rate:"سعر الصرف (دينار لكل دولار)",rn:"سعر الصرف يُدخَل يدوياً وليس مباشراً من السوق.",h:["جلسة","7 جلسات","30 جلسة"],u:{ounce:"أونصة",g24:"غرام 24",g21:"غرام 21",g18:"غرام 18"},un:{ounce:"سعر الأونصة",g24:"عيار 24 · ذهب نقي",g21:"عيار 21",g18:"عيار 18"},buy:"إشارة شراء",sell:"إشارة بيع",hz:n=>n==1?"لجلسة تداول واحدة":n<=10?`خلال ${n} جلسات تداول`:`خلال ${n} جلسة تداول`,ready:"النموذج جاهز",busy:"جارٍ التوقع…",off:"السيرفر غير متصل",lang:"English",now:"الآن",tgt:"التوقع",errmsg:"تعذّر الاتصال بالسيرفر. شغّل run_app.bat ثم اضغط «تحديث».",up:"صعود",dn:"هبوط",neu:"محايد",hold:"إشارة محايدة",edge:"الأفضلية الإحصائية",edgeY:"مؤكدة",edgeN:"غير مؤكدة",base:"الأساس",asof:"بيانات حتى",stale:(d,n)=>`آخر سعر في البيانات بتاريخ ${d} (قبل ${n} يوماً). حدّث ملف XAU_1d_data.csv حتى يعتمد التوقع على السوق الحالي.`},
en:{title:"Gold forecasts, powered by data",desc:"A machine-learning model trained on historical prices. Results are estimates, not investment advice.",plabel:"Predicted closing price",cur:"Current price",diff:"Expected move",unitl:"Unit",hor:"Forecast horizon",unit:"Unit and karat",run:"Run forecast",refresh:"Refresh",clear:"Clear",chart:"Price path and forecast",e1:"No results yet",e2:"Press Run forecast to draw the path.",lh:"Current price and history",lf:"Forecast",acc:"Model performance",test:"Direction accuracy",model:"Model",sig:"Signal",warn:"Accuracy is measured on the most recent 15% of data the model never saw during training, and compared with a baseline. It does not guarantee future results.",all:"Forecast in every unit",iqdv:"Value in Iraqi dinar",conv:"USD to IQD converter",usd:"Amount in USD",iqd:"Amount in IQD",rate:"Exchange rate (IQD per USD)",rn:"The exchange rate is entered manually and is not a live market feed.",h:["1 session","7 sessions","30 sessions"],u:{ounce:"Ounce",g24:"Gram 24",g21:"Gram 21",g18:"Gram 18"},un:{ounce:"Per troy ounce",g24:"24K · pure gold",g21:"21K",g18:"18K"},buy:"Buy signal",sell:"Sell signal",hz:n=>`over ${n} trading ${n==1?"session":"sessions"}`,ready:"Model ready",busy:"Forecasting…",off:"Server offline",lang:"العربية",now:"Now",tgt:"Forecast",errmsg:"Cannot reach the server. Run run_app.bat, then press Refresh.",up:"Bullish",dn:"Bearish",neu:"Neutral",hold:"Neutral signal",edge:"Statistical edge",edgeY:"Confirmed",edgeN:"Not confirmed",base:"baseline",asof:"Data as of",stale:(d,n)=>`The latest price in the data is from ${d} (${n} days ago). Update XAU_1d_data.csv so the forecast reflects the current market.`}
};
const API=location.protocol==="file:"?"http://127.0.0.1:8000":"";
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let lang=document.documentElement.lang==="en"?"en":"ar",theme=document.documentElement.dataset.theme,horizon=1,unit="ounce",data=null,chart=null,shown=0;
const fmt=(n,d=2)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const status=(k,c)=>{$("st").textContent=T[lang][k];$("dot").className="dot "+(c||"")};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  const el=$("price"),from=shown;shown=to;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent="$"+fmt(to);return}
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent="$"+fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0);

  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);

  [...$("useg").children].forEach((b,i)=>{b.textContent=t.u[b.dataset.v];const on=b.dataset.v===unit;b.setAttribute("aria-pressed",on);if(on)$("useg").style.setProperty("--i",i)});

function render(animate=true){
  const t=T[lang];
  $("tiles").innerHTML=Object.keys(DIV).map(k=>`<button class="tile ${k===unit?"on":""}" data-u="${k}"><span>${t.u[k]}</span><small>${t.un[k]}</small><b class="num">${data?"$"+fmt(data.target_price/DIV[k]):"—"}</b></button>`).join("");
  if(!data){$("empty").style.display="grid";ring(null);return}
  const d=DIV[unit],dir=data.predicted_direction,up=dir==="BUY",hold=dir==="HOLD",cls=up?"up":hold?"":"down",pct=Number(data.predicted_pct_change),tgt=data.target_price/d,cur=data.current_price/d;
  animate?count(tgt):($("price").textContent="$"+fmt(tgt),shown=tgt);
  const b=$("dir");b.textContent=up?t.buy:hold?t.hold:t.sell;b.className="badge "+cls;
  $("chgb").hidden=false;$("chgb").className="badge "+cls;$("chg").textContent=(pct>0?"+":"")+fmt(pct)+"%";
  $("sig").textContent=(up?t.up:hold?t.neu:t.dn)+" ("+fmt(data.confidence,0)+"%)";
  $("edge").textContent=(data.edge?t.edgeY:t.edgeN)+" ("+t.base+" "+fmt(data.baseline*100,0)+"%)";
  ring(data.accuracy);
  const sl=$("stale");sl.hidden=!(data.data_age_days>5);sl.textContent=sl.hidden?"":"⚠ "+t.stale(data.as_of,data.data_age_days);
  $("hz").textContent=t.hz(data.horizon)+" — "+t.asof+" "+data.as_of;
  $("cur").textContent="$"+fmt(cur);
  $("diff").textContent=(tgt>=cur?"+":"−")+"$"+fmt(Math.abs(tgt-cur));
  $("iqdv").textContent=fmt(tgt*(+$("rate").value||0),0)+" IQD";
  draw(d,dir);
}

function draw(d,dir){
  if(typeof Chart==="undefined")return;
  const t=T[lang],hist=(Array.isArray(data.history)?data.history:[]).map(p=>p/d),n=hist.length,cur=data.current_price/d,tgt=data.target_price/d;
  const labels=[...hist.map((_,i)=>"−"+(n-i)),t.now,t.tgt],col=dir==="BUY"?css("--up"):dir==="SELL"?css("--down"):css("--gold"),gold=css("--gold"),mut=css("--mut"),ln=css("--line");
  if(chart)chart.destroy();
  const ctx=$("cv").getContext("2d"),g=ctx.createLinearGradient(0,0,0,300);g.addColorStop(0,gold+"55");g.addColorStop(1,gold+"00");
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  chart=new Chart(ctx,{type:"line",data:{labels,datasets:[
    {data:[...hist,cur,null],borderColor:gold,backgroundColor:g,fill:true,borderWidth:2.5,tension:.3,pointRadius:c=>c.dataIndex===n?5:0,pointBackgroundColor:gold},
    {data:[...hist.map(()=>null),cur,tgt],borderColor:col,borderDash:[7,6],borderWidth:2.5,pointRadius:c=>c.dataIndex===n+1?7:0,pointBackgroundColor:col}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{rtl:false,backgroundColor:"#101014",borderColor:"#ffffff22",borderWidth:1,titleColor:"#9a9aa6",bodyColor:"#fff",padding:10,callbacks:{label:c=>c.raw==null?null:"$"+fmt(c.raw)}}},
    scales:{x:{grid:{display:false},ticks:{color:mut,maxTicksLimit:6}},y:{grid:{color:ln},ticks:{color:mut,callback:v=>"$"+fmt(v,0)}}}}});
  $("empty").style.display="none";
}

async function predict(){
  $("run").disabled=true;$("err").classList.remove("show");status("busy","busy");$("price").classList.add("skel");
  try{
    const r=await fetch(`${API}/predict?horizon=${horizon}`);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    if(j.status==="error"){const se=new Error(j.message||"error");se.server=true;throw se}
    data=j;status("ready","ok");render();
  }catch(e){status("off","err");$("err").textContent=e.server?e.message:T[lang].errmsg;$("err").classList.add("show")}
  finally{$("run").disabled=false;$("price").classList.remove("skel")}
}

function clearAll(){
  data=null;shown=0;if(chart){chart.destroy();chart=null}
  ["price","cur","diff","iqdv","sig","edge"].forEach(i=>$(i).textContent="—");ring(null);$("stale").hidden=true;
  $("dir").textContent="—";$("dir").className="badge";$("chgb").hidden=true;$("hz").textContent="";
  render(false);status("ready","ok");
}

$("run").onclick=predict;$("refresh").onclick=predict;$("clear").onclick=clearAll;
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";sv("ag-lang",lang);paint()};
$("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";sv("ag-theme",theme);paint()};
$("hseg").onclick=e=>{const b=e.target.closest("button");if(!b)return;horizon=+b.dataset.v;paint();if(data)predict()};
$("useg").onclick=e=>{const b=e.target.closest("button");if(!b)return;unit=b.dataset.v;paint()};
$("tiles").onclick=e=>{const b=e.target.closest("button");if(!b)return;unit=b.dataset.u;paint()};
const usd=$("usd"),iqd=$("iqd"),rate=$("rate");
usd.oninput=()=>{const r=+rate.value;iqd.value=usd.value&&r>0?(usd.value*r).toFixed(0):""};
iqd.oninput=()=>{const r=+rate.value;usd.value=iqd.value&&r>0?(iqd.value/r).toFixed(2):""};
rate.oninput=()=>{const r=+rate.value;if(usd.value)iqd.value=r>0?(usd.value*r).toFixed(0):"";if(data)render(false)};
paint();predict();
</script>
</body>
</html>
